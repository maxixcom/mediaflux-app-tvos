# Проект Xcode генерируется из этого файла: `xcodegen generate` (сам .xcodeproj в git не лежит).
#
# Цели:
# - DodocastTV      — клиент Apple TV (MF-90, Э3): выбор сервера, вход по коду, каталог, плеер, позиция;
# - DodocastTVTests — его юнит-тесты;
# - DodocastTVUITests — сценарии на симуляторе с пультом (`scripts/ui-check.sh`, схема DodocastTVScenarios);
# - Spike           — пробное приложение Э0 (MF-87, MF-97) без изменений: замеры плеера (`scripts/tv-matrix.sh`).
#
# Бренд (имя, bundle id, логотип, цвет, список серверов) — только в DodocastTV/Brand: код клиента бренда по имени не
# знает. Второй продукт на той же платформе — вторая цель со своим Brand (APPS.md, решение 18.11.2026).
name: DodocastTV
options:
  bundleIdPrefix: com.dodocast
  # tvOS 18: боковое меню разделов (`Tab`, `.sidebarAdaptable`), как у приложения Apple TV. Железо то же, что у 17.
  deploymentTarget:
    tvOS: "18.0"
  developmentLanguage: ru
settings:
  base:
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  # Версия закреплена: тот же номер у CLI кодогенерации в scripts/codegen.sh — код и библиотека должны совпадать.
  Apollo:
    url: https://github.com/apollographql/apollo-ios.git
    exactVersion: 2.5.0
# Файлы вне сборки — только чтобы видеть их в навигаторе Xcode (группы без цели, в приложение не попадают).
fileGroups:
  - project.yml
  - README.md
  - CLAUDE.md
  - apollo-codegen-config.json
  - scripts
targets:
  DodocastTV:
    type: application
    platform: tvOS
    sources:
      - path: DodocastTV
        excludes:
          - "GraphQL/**/*.graphql"
          - "GraphQL/operation-manifest.json"
    dependencies:
      - package: Apollo
        product: Apollo
    scheme:
      testTargets: [DodocastTVTests]
    info:
      path: DodocastTV/Info.plist
      properties:
        CFBundleDisplayName: dodocast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        # Локальная среда (http://localhost:17091) — только для симулятора: стенды ходят по HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dodocast.tv
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        # Иконка tvOS — стопка слоёв (фон и логотип) и картинки полки: Brand/Assets.xcassets, рисует
        # scripts/brand-icon.swift из логотипа брендбука.
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        # Сборка для App Store скрывает выбор сервера (APPS.md §5.1): собирать с
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) APP_STORE'.
  DodocastTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [DodocastTVTests]
    dependencies:
      - target: DodocastTV
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DodocastTV.app/DodocastTV
        BUNDLE_LOADER: $(TEST_HOST)
  # Сценарии на симуляторе с пультом (XCUIRemote): фокус, переходы, «Назад». Нужны вход на симуляторе и живой сервер,
  # поэтому — своя схема DodocastTVScenarios, а не тесты схемы клиента. Запуск — scripts/ui-check.sh.
  DodocastTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [DodocastTVUITests]
    dependencies:
      - target: DodocastTV
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DodocastTV
  Spike:
    type: application
    platform: tvOS
    sources: [Spike]
    scheme: {}
    info:
      path: Spike/Info.plist
      properties:
        CFBundleDisplayName: dodocast Э0
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        # Отдельный идентификатор под спайк: бесплатная команда Apple закрепляет его за собой.
        PRODUCT_BUNDLE_IDENTIFIER: com.dodocast.tv.spike
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
schemes:
  DodocastTVScenarios:
    build:
      targets:
        DodocastTV: all
        DodocastTVUITests: [test]
    test:
      config: Debug
      targets: [DodocastTVUITests]
