# Состояние зрителя (APPS.md §7): «просмотрено», избранное, недавние поиски. Позиция просмотра — в плеере (шаг 3.3).

mutation MarkWatched($mediaId: ID!, $watched: Boolean!) {
  markWatched(mediaId: $mediaId, watched: $watched) {
    positionMs
    watched
  }
}

mutation FavoriteAdd($target: FavoriteTargetInput!) {
  favoriteAdd(target: $target)
}

mutation FavoriteRemove($target: FavoriteTargetInput!) {
  favoriteRemove(target: $target)
}

# Недавние поиски (MF-114): материалы, на чьи карточки переходили из поиска, общие на аккаунт.
query SearchRecents {
  searchRecents {
    ...MediaCard
  }
}

mutation SearchRecentAdd($mediaId: ID!) {
  searchRecentAdd(mediaId: $mediaId)
}

mutation SearchRecentsClear {
  searchRecentsClear
}
